<div class="status-row">

  <!-- Last Update -->
  <div class="stat-card">
    <span class="stat-label">Last Update</span>
    <div class="stat-live-row">
      @if (lab().isLive) {
      <span class="live-dot"></span>
      }
      <span class="stat-value">{{ lab().getFormattedLastUpdate() }}</span>
      @if (lab().isLive) {
      <span class="live-label">· Live</span>
      }
    </div>
  </div>

  <!-- Next Maintenance -->
  <div class="stat-card">
    <div class="stat-top-row">
      <span class="stat-label">Next Maintenance</span>
      <app-status-badge [severity]="lab().isMaintenanceUrgent() ? 'warning' : 'info'"
        [label]="lab().getMaintenanceBadgeLabel().toUpperCase()" [showDot]="false" />
    </div>
    <span class="stat-value">{{ lab().getFormattedMaintenance() }}</span>
    <span class="stat-sub">In {{ lab().maintenanceDaysLeft }} days</span>
  </div>

</div>
