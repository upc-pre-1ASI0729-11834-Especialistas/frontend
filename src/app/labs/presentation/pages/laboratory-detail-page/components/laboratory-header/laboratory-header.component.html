<div class="lab-header">
  <div class="lab-header-left">
    <div class="lab-title-row">
      <h2 class="lab-name">{{ lab().name }}</h2>
      <app-status-badge [severity]="lab().status" [label]="lab().overallStatus" [showDot]="true" />
    </div>
    <div class="lab-meta">
      <span class="meta-item">
        <mat-icon>corporate_fare</mat-icon>
        {{ lab().building }}
      </span>
      <span class="meta-dot">•</span>
      <span class="meta-item">
        <mat-icon>layers</mat-icon>
        {{ lab().floor }}
      </span>
      <span class="meta-dot">•</span>
      <span class="meta-item">
        <mat-icon>tag</mat-icon>
        ID: {{ lab().labCode }}
      </span>
    </div>
  </div>
  <div class="lab-header-actions">
    <button class="btn-secondary" id="edit-lab-btn">
      <mat-icon>edit</mat-icon>
      Edit Laboratory
    </button>
    <button class="btn-danger" id="delete-lab-btn">
      <mat-icon>delete</mat-icon>
      Delete
    </button>
  </div>
</div>
