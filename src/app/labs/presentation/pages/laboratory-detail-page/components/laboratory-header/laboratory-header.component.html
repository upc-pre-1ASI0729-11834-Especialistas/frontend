<div class="lab-header">
  <div class="lab-header-left">
    <div class="lab-title-row">
      <h1 class="lab-name">{{ lab().name }} — {{ lab().type }}</h1>
      <app-status-badge
        [severity]="lab().isCritical() ? 'critical' : lab().isWarning() ? 'warning' : 'normal'"
        [label]="lab().overallStatus"
        [showDot]="true" />
    </div>
    <p class="lab-meta">{{ lab().building }} · {{ lab().floor }} · {{ lab().metrics.length * 2 }} sensors active</p>
  </div>
  <div class="lab-header-actions">
    @if (lab().isCritical() || lab().isWarning()) {
    <button class="btn-emergency">
      <mat-icon>emergency</mat-icon>
      Emergency Protocol
    </button>
    }
    <button class="btn-primary" (click)="addObservation.emit()">
      <mat-icon>edit_note</mat-icon>
      Add Observation
    </button>
    <button class="btn-secondary" [routerLink]="['/laboratories', lab().id, 'edit']">
      <mat-icon>edit</mat-icon>
      Edit
    </button>
  </div>
</div>
