<div class="schedules-card">
  <div class="section-header">
    <h3 class="section-title">Active Automations</h3>
    <a class="section-link" routerLink="/settings">Manage</a>
  </div>
  <div class="schedules-list">
    @for (schedule of schedules(); track schedule.id) {
    <div class="schedule-item">
      <div class="schedule-info">
        <span class="schedule-name">{{ schedule.name }}</span>
        <span class="schedule-status" [class.status--running]="schedule.active">
          {{ schedule.active ? '● Running' : '○ Standby' }}
        </span>
      </div>
      <div class="toggle" [class.toggle--active]="schedule.active">
        <div class="toggle-thumb"></div>
      </div>
    </div>
    }
  </div>
</div>
