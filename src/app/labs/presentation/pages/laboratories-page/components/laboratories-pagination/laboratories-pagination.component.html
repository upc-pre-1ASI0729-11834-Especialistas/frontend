@if (totalPages() > 1) {
<div class="pagination">
  <span class="pagination-info">
    Showing <strong>{{ showingFrom() }}</strong> to
    <strong>{{ showingTo() }}</strong> of
    <strong>{{ totalCount() }}</strong> labs
  </span>

  <div class="pagination-controls">
    <button mat-stroked-button [disabled]="currentPage() === 1" (click)="prevPage.emit()">
      Prev
    </button>

    @for (p of pages(); track $index) {
    @if (p === '...') {
    <span class="page-ellipsis">…</span>
    } @else {
    <button mat-stroked-button [class.active]="currentPage() === p" (click)="pageClick.emit(p)">
      {{ p }}
    </button>
    }
    }

    <button mat-stroked-button [disabled]="currentPage() === totalPages()" (click)="nextPage.emit()">
      Next
    </button>
  </div>
</div>
}
