<app-card padding="section" [hoverLift]="true">
  <app-section-header icon="notifications" iconColor="var(--warning-color)" title="{{ 'laboratoryForm.notifications.title' | translate }}"
    subtitle="{{ 'laboratoryForm.notifications.subtitle' | translate }}" />

  <div class="notifications-grid">
    <label class="notif-card-wrap">
      <app-card class="notif-card" [borderColor]="notifications().email ? 'var(--mat-sys-primary-container)' : ''"
        [bgColor]="notifications().email ? 'var(--mat-sys-primary-container)' : ''" padding="compact">
        <div class="notif-row">
          <mat-checkbox [(ngModel)]="notifications().email" />
          <app-icon-badge color="var(--mat-sys-primary)" size="md">
            <mat-icon>email</mat-icon>
          </app-icon-badge>
          <div class="notif-text">
            <h4 class="notif-title">{{ 'laboratoryForm.notifications.email' | translate }}</h4>
            <p class="notif-desc">{{ 'laboratoryForm.notifications.emailDesc' | translate }}</p>
          </div>
        </div>
      </app-card>
    </label>

    <label class="notif-card-wrap">
      <app-card class="notif-card" [borderColor]="notifications().sms ? 'color-mix(in srgb, var(--success-color) 20%, transparent)' : ''"
        [bgColor]="notifications().sms ? 'color-mix(in srgb, var(--success-color) 8%, transparent)' : ''" padding="compact">
        <div class="notif-row">
          <mat-checkbox [(ngModel)]="notifications().sms" />
          <app-icon-badge color="var(--success-color)" size="md">
            <mat-icon>chat</mat-icon>
          </app-icon-badge>
          <div class="notif-text">
            <h4 class="notif-title">{{ 'laboratoryForm.notifications.sms' | translate }}</h4>
            <p class="notif-desc">{{ 'laboratoryForm.notifications.smsDesc' | translate }}</p>
          </div>
        </div>
      </app-card>
    </label>

    <label class="notif-card-wrap">
      <app-card class="notif-card" [borderColor]="notifications().push ? 'var(--warning-color)' : ''"
        [bgColor]="notifications().push ? 'var(--mat-sys-background)' : ''" padding="compact">
        <div class="notif-row">
          <mat-checkbox [(ngModel)]="notifications().push" />
          <app-icon-badge color="var(--warning-color)" size="md">
            <mat-icon>notifications</mat-icon>
          </app-icon-badge>
          <div class="notif-text">
            <h4 class="notif-title">{{ 'laboratoryForm.notifications.push' | translate }}</h4>
            <p class="notif-desc">{{ 'laboratoryForm.notifications.pushDesc' | translate }}</p>
          </div>
        </div>
      </app-card>
    </label>

    <app-card class="notif-card critical-card-wrap" borderColor="var(--warning-color)" bgColor="var(--mat-sys-background)" padding="compact">
      <div class="notif-row critical-row">
        <app-icon-badge color="var(--warning-color)" size="sm">
          <mat-icon>warning</mat-icon>
        </app-icon-badge>
        <div class="notif-text">
          <h4 class="notif-title">{{ 'laboratoryForm.notifications.criticalOnly' | translate }}</h4>
          <p class="notif-desc">{{ 'laboratoryForm.notifications.criticalOnlyDesc' | translate }}</p>
        </div>
        <mat-slide-toggle [(ngModel)]="notifications().criticalOnly" />
      </div>
    </app-card>
  </div>
</app-card>
