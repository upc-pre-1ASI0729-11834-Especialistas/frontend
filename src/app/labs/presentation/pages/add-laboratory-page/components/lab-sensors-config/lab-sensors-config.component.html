<app-card padding="section" [hoverLift]="true">
  <app-section-header icon="sensors" iconColor="var(--mat-sys-primary)" title="Sensors & Systems"
    subtitle="Enable or disable monitoring modules for this laboratory and configure safety thresholds" />

  <div class="sensors-grid">
    @for (sub of metricSubscriptions(); track sub.metricTypeId) {
    <div class="sensor-card" [class.active]="sub.enabled">
      <div class="sensor-card-header">
        <app-icon-badge [color]="sub.enabled ? 'var(--mat-sys-primary)' : 'var(--mat-sys-on-surface-variant)'" size="md">
          <mat-icon>{{ sub.metricTypeIcon }}</mat-icon>
        </app-icon-badge>
        <mat-slide-toggle [checked]="sub.enabled" (change)="toggleSubscription(sub.metricTypeId)" />
      </div>
      <h4 class="sensor-name">{{ sub.metricTypeDisplayName }}</h4>
      <p class="sensor-desc">Monitor {{ sub.metricTypeDisplayName }} ({{ sub.metricTypeUnit }})</p>

      @if (sub.enabled) {
        <div class="thresholds-inputs">
          <div class="threshold-field">
            <label>Min ({{ sub.metricTypeUnit }})</label>
            <input type="number" 
                   [ngModel]="sub.minThreshold" 
                   (ngModelChange)="onThresholdChange(sub.metricTypeId, 'min', $event)" 
                   placeholder="No limit" />
          </div>
          <div class="threshold-field">
            <label>Max ({{ sub.metricTypeUnit }})</label>
            <input type="number" 
                   [ngModel]="sub.maxThreshold" 
                   (ngModelChange)="onThresholdChange(sub.metricTypeId, 'max', $event)" 
                   placeholder="No limit" />
          </div>
        </div>
      }
    </div>
    }
  </div>
</app-card>
