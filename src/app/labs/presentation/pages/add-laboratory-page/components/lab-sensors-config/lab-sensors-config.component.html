<app-card padding="section" [hoverLift]="true">
  <app-section-header icon="memory" iconColor="var(--mat-sys-primary)" title="Sensors & Systems"
    subtitle="Enable or disable monitoring modules for this laboratory" />

  <div class="sensors-grid">
    @for (sensor of sensorCards(); track sensor.key) {
    <div class="sensor-card" [class.active]="sensors()[sensor.key]">
      <div class="sensor-card-header">
        <app-icon-badge [color]="sensors()[sensor.key] ? sensor.color : 'var(--mat-sys-on-surface-variant)'" size="md">
          <mat-icon>{{ sensor.icon }}</mat-icon>
        </app-icon-badge>
        <mat-slide-toggle [checked]="sensors()[sensor.key]" (change)="toggleSensor(sensor.key)" />
      </div>
      <h4 class="sensor-name">{{ sensor.label }}</h4>
      <p class="sensor-desc">{{ sensor.description }}</p>
      <span class="sensor-badge" [class.active]="sensors()[sensor.key]">
        {{ sensors()[sensor.key] ? 'Active' : 'Inactive' }}
      </span>
    </div>
    }
  </div>
</app-card>
