<div class="escalate-dialog">
 
   <!-- HEADER -->
   <div class="dialog-header">
     <div class="header-icon">
       <mat-icon>phone_in_talk</mat-icon>
     </div>
     <div class="header-text">
       <h2>{{ 'incident.details.escalateSupervisor' | translate }}</h2>
       <p>{{ data.equipmentName }} — {{ data.incidentDescription }}</p>
     </div>
   </div>
 
   <mat-dialog-content class="dialog-body">
 
     <!-- ESCALATION REASON -->
     <div class="field-group">
       <label class="field-label">{{ 'incident.escalate.escalation_reason' | translate }}</label>
       <select
         class="custom-select"
         [ngModel]="selectedReason()"
         (ngModelChange)="selectedReason.set($event)"
       >
         <option value="" disabled>{{ 'incident.escalate.select_reason' | translate }}</option>
         @for (reason of reasons; track reason) {
           <option [value]="reason">{{ reason | translate }}</option>
         }
       </select>
     </div>
 
     <!-- MESSAGE -->
     <div class="field-group">
       <label class="field-label">{{ 'incident.escalate.message_to_supervisor' | translate }} <span class="optional">({{ 'incident.resolve.optional' | translate }})</span></label>
       <textarea
         class="custom-textarea"
         [placeholder]="'incident.escalate.add_context_for_the' | translate"
         [ngModel]="message()"
         (ngModelChange)="message.set($event)"
         rows="4"
       ></textarea>
     </div>
 
     <!-- NOTIFY VIA -->
     <div class="field-group">
       <label class="field-label">{{ 'incident.escalate.notify_via' | translate }}</label>
       <div class="notify-buttons">
         <button
           class="notify-btn"
           [class.active]="notifyEmail()"
           (click)="toggleEmail()"
           type="button"
         >
           <mat-icon>email</mat-icon>
           Email
         </button>
         <button
           class="notify-btn"
           [class.active]="notifyInApp()"
           (click)="toggleInApp()"
           type="button"
         >
           <mat-icon>notifications</mat-icon>
           In-app notification
         </button>
       </div>
     </div>
 
     <!-- SUPERVISOR INFO -->
     <div class="supervisor-info">
       <mat-icon class="info-icon">info</mat-icon>
       <span><strong>{{ 'incident.escalate.supervisor_on_duty' | translate }}</strong> {{ 'incident.escalate.dr_jean_arizabal_last' | translate }}</span>
     </div>
 
   </mat-dialog-content>
 
   <!-- ACTIONS -->
   <mat-dialog-actions class="dialog-actions">
     <button class="btn-cancel" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
     <button
       class="btn-send"
       (click)="send()"
       [disabled]="!selectedReason()"
     >
       {{ 'incident.escalate.send_escalation' | translate }}
     </button>
   </mat-dialog-actions>
 
 </div>
