<mat-toolbar class="topbar" color="primary">

  @if (showHamburger) {
    <button
      mat-icon-button
      class="hamburger-btn"
      aria-label="Toggle sidebar"
      (click)="hamburgerClick.emit()">
      <mat-icon>menu</mat-icon>
    </button>
  }

  <div class="view-info">
    <p class="view-title">{{ title }}</p>
    <p class="view-subtitle">{{ subtitle }}</p>
  </div>

  <span class="spacer"></span>

  @if (action) {
    <button
      mat-flat-button
      color="primary"
      class="topbar-action-btn"
      [id]="action.id"
      (click)="onActionClick()">
      @if (action.icon) {
        <mat-icon class="btn-icon">{{ action.icon }}</mat-icon>
      }
      <span class="btn-label">{{ action.label }}</span>
    </button>
  } @else {
    <mat-form-field appearance="outline" class="search-field">
      <input matInput placeholder="Search labs or alerts...">
    </mat-form-field>
  }

  <div class="language-switcher-wrapper">
    <app-language-switcher></app-language-switcher>
  </div>

</mat-toolbar>
