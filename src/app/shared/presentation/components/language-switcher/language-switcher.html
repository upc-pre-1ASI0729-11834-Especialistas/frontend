<mat-button-toggle-group [value]="currentLanguage" (change)="useLanguage($event.value)" appearance="standard" [attr.aria-label]="'common.preferredLanguage' | translate" name="language">
  @for (language of languages; track language) {
    <mat-button-toggle [aria-label]="language"
                       [value]="language"> {{ language.toUpperCase()}}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
