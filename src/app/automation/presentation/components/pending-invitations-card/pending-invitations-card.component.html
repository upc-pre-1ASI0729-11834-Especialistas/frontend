<mat-card appearance="outlined" class="invitations-card">
  <mat-card-content class="card-content">

    <div class="card-header">
      <div class="header-left">
        <mat-icon class="header-icon">mail_outline</mat-icon>
        <h3 class="card-title">Pending Invitations</h3>
      </div>
      <span class="count-circle">{{ totalCount }}</span>
    </div>

    @for (invitation of invitations; track invitation.id) {
      <div class="invitation-item">
        <p class="invitation-email">{{ invitation.email }}</p>
        <p class="invitation-detail">Invited as <strong>{{ invitation.role }}</strong></p>
        <p class="invitation-time">{{ invitation.sentTimeAgo }}</p>

        <div class="invitation-actions">
          <button mat-stroked-button class="action-btn cancel-btn" (click)="cancel.emit(invitation.id)">Cancel</button>
          <button mat-stroked-button color="primary" class="action-btn resend-btn" (click)="resend.emit(invitation.id)">Resend</button>
        </div>
      </div>
    }

    @if (invitations.length === 0) {
      <p class="empty-text">No pending invitations</p>
    }

  </mat-card-content>
</mat-card>
