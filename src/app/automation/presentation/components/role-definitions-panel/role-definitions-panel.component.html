<mat-accordion>
  <mat-expansion-panel class="roles-panel">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon class="panel-icon">settings</mat-icon>
        <span class="panel-title-text">Role definitions</span>
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="roles-list">
      @for (role of roles; track role.id) {
        <div class="role-item">
          <div class="role-header">
            <span class="role-name">{{ role.name }}</span>
            <span class="role-permissions">{{ role.permissionsCount }} permissions</span>
          </div>
          <p class="role-description">{{ role.description }}</p>
        </div>
      }
    </div>

  </mat-expansion-panel>
</mat-accordion>
