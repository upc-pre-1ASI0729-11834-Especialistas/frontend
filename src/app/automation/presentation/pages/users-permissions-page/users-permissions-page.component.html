<div class="page-body">

  <!-- Main Content Grid -->
  <div class="main-grid">

    <!-- Left: Active Users Table -->
    <div class="main-column">
      <app-active-users-table
        [users]="automationStore.labUsers()"
        [totalCount]="automationStore.labUsersCount()">
      </app-active-users-table>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar-column">
      <app-pending-invitations-card
        [invitations]="automationStore.pendingInvitations()"
        [totalCount]="automationStore.pendingInvitationsCount()">
      </app-pending-invitations-card>

      <app-role-definitions-panel
        [roles]="automationStore.roleDefinitions()">
      </app-role-definitions-panel>
    </div>

  </div>

</div>
