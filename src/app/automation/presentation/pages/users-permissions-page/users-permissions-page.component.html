<div class="page-body">

  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Users & Permissions</h1>
      <p class="page-subtitle">Control who has access to SafeLab and what they can do</p>
    </div>
    <button mat-flat-button color="primary" class="invite-btn">
      <mat-icon>add</mat-icon>
      Invite User
    </button>
  </div>

  <!-- Main Content Grid -->
  <div class="main-grid">

    <!-- Left: Active Users Table -->
    <div class="main-column">
      <app-active-users-table
        [users]="automationStore.labUsers()"
        [totalCount]="automationStore.labUsersCount()">
      </app-active-users-table>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar-column">
      <app-pending-invitations-card
        [invitations]="automationStore.pendingInvitations()"
        [totalCount]="automationStore.pendingInvitationsCount()">
      </app-pending-invitations-card>

      <app-role-definitions-panel
        [roles]="automationStore.roleDefinitions()">
      </app-role-definitions-panel>
    </div>

  </div>

</div>
